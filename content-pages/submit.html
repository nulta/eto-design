<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark" />
    <title>문제</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="content-style.css">
    <script type="module" src="../js/background-component.js"></script>

    <!-- external: tabler icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
</head>
<body>
    <background-component></background-component>

    <aside class="global-navbar">
        <button class="-icon -tooltip-right" data-tooltip="홈">
            <img src="../assets/square-logo.png">
        </button>
        <hr>
        <button class="-icon -tooltip-right" data-tooltip="문제 목록">
            <i class="ti ti-books"></i>
        </button>
        <button class="-icon -tooltip-right" data-tooltip="유저 목록">
            <i class="ti ti-users"></i>
        </button>
        <button class="-icon -tooltip-right" data-tooltip="서버 목록">
            <i class="ti ti-world"></i>
        </button>
        <button class="last avatar-picture">
            <img src="../assets/profile-placeholder.png" class="profile">
        </button>
    </aside>

    <aside class="local-navbar">
        <button class="-icon -tooltip-left" data-tooltip="공유">
            <i class="ti ti-share"></i>
        </button>
        <button class="-icon -tooltip-left" data-tooltip="제출 기록">
            <i class="ti ti-files"></i>
        </button>
        <button class="-primary -icon -tooltip-left" data-tooltip="제출" onclick="document.location = 'submit.html'">
            <i class="ti ti-send"></i>
        </button>
    </aside>

    <main>
        <header class="problem-header">
            <h1>좀 긴 제목을 가지고 어떻게 예제를 만들수 있을까 고민해보았지만 딱히 답이 나오지 않아 오오-</h1>
            <p class="problemid">1024::problem.server</p>
            <select class="right -primary -mono">
                <option value="ko">KO</option>
                <option value="en">EN</option>
            </select>
        </header>
        <section class="text-contents">
            <p style="text-align:center;">
                제출 형식
                <select class="-secondary -mono">
                    <option>C20</option>
                    <option>C++23</option>
                    <option>Python</option>
                </select>
            </p>

            <p style="font-family: var(--font-mono); color:var(--color-primary)">
                main.c
            </p>

            <textarea class="-mono" style="height: 70vh">#include &lt;stdio.h&gt;

int main() {
    printf("Hello, World!");
    return 0;
}
</textarea>

            <p style="text-align: center;">
                <button class="-outlined -icon" onclick="document.location = 'problem.html'">
                    <i class="ti -big ti-arrow-left"></i>
                </button>
                <button class="-primary -wide">
                    <i class="ti -big ti-send"></i> 제출!
                </button>
            </p>
        </section>
    </main>
</body>
</html>
